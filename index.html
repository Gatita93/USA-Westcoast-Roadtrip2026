<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USA Roadtrip 2026 – Sabrina & Joachim</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 0;
  }

  h1 {
    text-align: center;
    padding: 1rem;
  }

  #map {
    height: 400px;
    margin: 0 1rem 1rem;
    border-radius: 0.8rem;
    overflow: hidden;
  }

  .day-card {
    background: white;
    margin: 1rem;
    padding: 1rem;
    border-radius: 0.8rem;
    border: 2px solid #e5e7eb;
  }

  .day-card.current {
    border-color: #3b82f6;
    box-shadow: 0 0 12px rgba(59,130,246,0.6);
    position: relative;
  }

  .day-card.current::before {
    content: "Heute";
    position: absolute;
    top: -10px;
    right: 12px;
    background: #3b82f6;
    color: white;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
  }

  .location-header {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .location-photo {
    width: 90px;
    height: 90px;
    border-radius: 0.6rem;
    object-fit: cover;
  }

  .photo-btn {
    margin-top: 0.8rem;
    padding: 0.6rem 1rem;
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 0.5rem;
    cursor: pointer;
  }

  .gallery {
    display: none;
    margin-top: 1rem;
  }

  .gallery img {
    width: 100%;
    border-radius: 0.6rem;
    margin-bottom: 0.5rem;
  }
</style>
</head>
<body>

<h1>USA Roadtrip 2026 – Sabrina & Joachim</h1>

<div id="map"></div>
<div id="days"></div>

<script>
  const today = new Date().toISOString().split("T")[0];

  const days = [
    { date: "2026-10-10", title: "San Francisco", img: "img/tag1.jpg" },
    { date: "2026-10-11", title: "Marina / Fleet Week", img: "img/tag2.jpg" },
    { date: "2026-10-12", title: "Alcatraz", img: "img/tag3.jpg" },
    { date: "2026-10-13", title: "Monterey", img: "img/tag4.jpg" },
    { date: "2026-10-14", title: "Pismo Beach", img: "img/tag5.jpg" },
    { date: "2026-10-15", title: "Los Angeles", img: "img/tag6.jpg" },
    { date: "2026-10-16", title: "Los Angeles", img: "img/tag7.jpg" },
    { date: "2026-10-17", title: "Las Vegas", img: "img/tag8.jpg" },
    { date: "2026-10-18", title: "Las Vegas", img: "img/tag9.jpg" },
    { date: "2026-10-19", title: "Zion National Park", img: "img/tag10.jpg" },
    { date: "2026-10-20", title: "Zion National Park", img: "img/tag11.jpg" },
    { date: "2026-10-21", title: "Bryce Canyon", img: "img/tag12.jpg" },
    { date: "2026-10-22", title: "Page / Antelope Canyon", img: "img/tag13.jpg" },
    { date: "2026-10-23", title: "Grand Canyon", img: "img/tag14.jpg" },
    { date: "2026-10-24", title: "Sedona", img: "img/tag15.jpg" },
    { date: "2026-10-25", title: "Prescott", img: "img/tag16.jpg" },
    { date: "2026-10-26", title: "Joshua Tree", img: "img/tag17.jpg" },
    { date: "2026-10-27", title: "Joshua Tree", img: "img/tag18.jpg" },
    { date: "2026-10-28", title: "San Diego", img: "img/tag19.jpg" },
    { date: "2026-10-29", title: "San Diego Harbour", img: "img/tag20.jpg" },
    { date: "2026-10-30", title: "San Diego Airport", img: "img/tag21.jpg" }
  ];

  const locations = {
    "2026-10-10": { lat: 37.7749, lng: -122.4194 },
    "2026-10-11": { lat: 37.806, lng: -122.432 },
    "2026-10-12": { lat: 37.8267, lng: -122.423 },
    "2026-10-13": { lat: 36.617, lng: -121.916 },
    "2026-10-14": { lat: 35.142, lng: -120.641 },
    "2026-10-15": { lat: 34.0522, lng: -118.2437 },
    "2026-10-16": { lat: 34.0522, lng: -118.2437 },
    "2026-10-17": { lat: 36.1699, lng: -115.1398 },
    "2026-10-18": { lat: 36.1699, lng: -115.1398 },
    "2026-10-19": { lat: 37.2982, lng: -113.0263 },
    "2026-10-20": { lat: 37.2982, lng: -113.0263 },
    "2026-10-21": { lat: 37.5930, lng: -112.1871 },
    "2026-10-22": { lat: 36.9147, lng: -111.4558 },
    "2026-10-23": { lat: 36.0544, lng: -112.1401 },
    "2026-10-24": { lat: 34.8697, lng: -111.7609 },
    "2026-10-25": { lat: 34.5400, lng: -112.4685 },
    "2026-10-26": { lat: 33.8734, lng: -115.9010 },
    "2026-10-27": { lat: 33.8734, lng: -115.9010 },
    "2026-10-28": { lat: 32.7970, lng: -117.2580 },
    "2026-10-29": { lat: 32.7090, lng: -117.1628 },
    "2026-10-30": { lat: 32.7338, lng: -117.1933 }
  };

  const container = document.getElementById("days");

  // Leaflet Map initialisieren
  const map = L.map('map').setView([36.0, -115.0], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const markers = [];
  let todayMarker = null;

  days.forEach((day, index) => {
    const card = document.createElement("div");
    card.className = "day-card";
    if (day.date === today) card.classList.add("current");

    card.innerHTML = `
      <div class="location-header">
        <img src="${day.img}" class="location-photo">
        <div>
          <h2>${day.title}</h2>
          <p>${day.date}</p>
        </div>
      </div>

      <button class="photo-btn" onclick="toggleGallery(${index})">Fotos ansehen</button>

      <div class="gallery" id="gallery-${index}">
        <img src="${day.img}">
      </div>
    `;

    container.appendChild(card);

    const loc = locations[day.date];
    if (loc) {
      const marker = L.marker([loc.lat, loc.lng]).addTo(map)
        .bindPopup(`${day.title} (${day.date})`);
      markers.push(marker);

      if (day.date === today) {
        todayMarker = marker;
      }
    }
  });

  if (todayMarker) {
    map.setView(todayMarker.getLatLng(), 8);
    todayMarker.openPopup();
  } else {
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds());
  }

  function toggleGallery(i) {
    const g = document.getElementById(`gallery-${i}`);
    g.style.display = g.style.display === "block" ? "none" : "block";
  }
</script>

</body>
</html>
