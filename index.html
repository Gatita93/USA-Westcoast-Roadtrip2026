<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USA Roadtrip 2026 – Sabrina & Joachim</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 0;
  }

  h1 {
    text-align: center;
    padding: 1rem;
  }

  #map {
    height: 350px;
    margin: 1rem;
    border-radius: 0.8rem;
    overflow: hidden;
  }

  .day-card {
    background: white;
    margin: 1rem;
    padding: 1rem;
    border-radius: 0.8rem;
    border: 2px solid #e5e7eb;
  }

  .day-card.current {
    border-color: #3b82f6;
    box-shadow: 0 0 12px rgba(59,130,246,0.6);
    position: relative;
  }

  .day-card.current::before {
    content: "Heute";
    position: absolute;
    top: -10px;
    right: 12px;
    background: #3b82f6;
    color: white;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
  }

  .marker-number {
    background: #2563eb;
    color: white;
    font-size: 14px;
    font-weight: bold;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid white;
  }
</style>
</head>
<body>

<h1>USA Roadtrip 2026 – Sabrina & Joachim</h1>

<div id="map"></div>
<div id="days"></div>

<script>
  const today = new Date().toISOString().split("T")[0];

  const days = [
    { date: "2026-10-10", title: "San Francisco" },
    { date: "2026-10-11", title: "Marina / Fleet Week" },
    { date: "2026-10-12", title: "Alcatraz" },
    { date: "2026-10-13", title: "Monterey" },
    { date: "2026-10-14", title: "Pismo Beach" },
    { date: "2026-10-15", title: "Los Angeles" },
    { date: "2026-10-16", title: "Los Angeles" },
    { date: "2026-10-17", title: "Las Vegas" },
    { date: "2026-10-18", title: "Las Vegas" },
    { date: "2026-10-19", title: "Zion National Park" },
    { date: "2026-10-20", title: "Zion National Park" },
    { date: "2026-10-21", title: "Bryce Canyon" },
    { date: "2026-10-22", title: "Page / Antelope Canyon" },
    { date: "2026-10-23", title: "Grand Canyon" },
    { date: "2026-10-24", title: "Sedona" },
    { date: "2026-10-25", title: "Prescott" },
    { date: "2026-10-26", title: "Joshua Tree" },
    { date: "2026-10-27", title: "Joshua Tree" },
    { date: "2026-10-28", title: "San Diego" },
    { date: "2026-10-29", title: "San Diego Harbour" },
    { date: "2026-10-30", title: "San Diego Airport" }
  ];

  const locations = {
    "2026-10-10": [37.7749, -122.4194],
    "2026-10-11": [37.806, -122.432],
    "2026-10-12": [37.8267, -122.423],
    "2026-10-13": [36.617, -121.916],
    "2026-10-14": [35.142, -120.641],
    "2026-10-15": [34.0522, -118.2437],
    "2026-10-16": [34.0522, -118.2437],
    "2026-10-17": [36.1699, -115.1398],
    "2026-10-18": [36.1699, -115.1398],
    "2026-10-19": [37.2982, -113.0263],
    "2026-10-20": [37.2982, -113.0263],
    "2026-10-21": [37.5930, -112.1871],
    "2026-10-22": [36.9147, -111.4558],
    "2026-10-23": [36.0544, -112.1401],
    "2026-10-24": [34.8697, -111.7609],
    "2026-10-25": [34.5400, -112.4685],
    "2026-10-26": [33.8734, -115.9010],
    "2026-10-27": [33.8734, -115.9010],
    "2026-10-28": [32.7970, -117.2580],
    "2026-10-29": [32.7090, -117.1628],
    "2026-10-30": [32.7338, -117.1933]
  };

  const map = L.map('map').setView([36.5, -115], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const carIcon = L.icon({
    iconUrl: 'auto-sabrina-joachim.png',
    iconSize: [50, 50],
    iconAnchor: [25, 25]
  });

  const markers = [];
  const routeCoords = [];

  days.forEach((day, index) => {
    const card = document.createElement("div");
    card.className = "day-card";
    if (day.date === today) card.classList.add("current");

    card.innerHTML = `
      <h2>${day.title}</h2>
      <p>${day.date}</p>
    `;
    document.getElementById("days").appendChild(card);

    const loc = locations[day.date];

    if (loc) {
      let marker;

      if (day.date === today) {
        marker = L.marker(loc, { icon: carIcon }).addTo(map);
      } else {
        const numberIcon = L.divIcon({
          html: `<div class="marker-number">${index + 1}</div>`,
          className: "",
          iconSize: [30, 30],
          iconAnchor: [15, 15]
        });
        marker = L.marker(loc, { icon: numberIcon }).addTo(map);
      }

      marker.bindPopup(`${day.title}<br>${day.date}`);
      markers.push(marker);
      routeCoords.push(loc);
    }
  });

  L.polyline(routeCoords, { color: 'blue', weight: 4 }).addTo(map);

  const group = L.featureGroup(markers);
  map.fitBounds(group.getBounds());
</script>

</body>
</html>
